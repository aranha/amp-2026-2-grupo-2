server {
    listen 80;
    root /usr/share/nginx/html;

    # Cabeçalhos de segurança do navegador.
    # CSP: só roda script desta origem e só conversa com o Keycloak e o BFF — um script injetado
    # (XSS) não carrega código de fora nem envia o token para outro endereço.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8180 http://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8180" always;
    # Não vaza o ?code= do callback no cabeçalho Referer para outros sites.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        # SPA: /callback e qualquer rota sem arquivo devolvem o index.html.
        try_files $uri $uri/ /index.html;
    }
}
