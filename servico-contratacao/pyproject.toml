[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servico-contratacao"
version = "0.1.0"
description = "Serviço de contratação e liberação de crédito"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.6,<3.0",
    "fastapi>=0.115,<1.0",
    "opentelemetry-distro>=0.50b0,<1.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
    "opentelemetry-instrumentation-psycopg>=0.50b0,<1.0",
    "opentelemetry-instrumentation-system-metrics>=0.50b0,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "application*", "adapters*"]
