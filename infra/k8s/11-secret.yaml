# Senhas do Postgres: a do superusuário e a de cada usuário de serviço (Database per Service).
# São as mesmas do docker-compose.yml e do init.sql, valores de laboratório.
#
# Quando não vale: em produção um Secret versionado no Git é vazamento — o base64 não cifra
# nada. Ali o caminho é Sealed Secrets ou External Secrets apontando para um cofre.
apiVersion: v1
kind: Secret
metadata:
  name: amp-banco
  namespace: amp
  labels:
    app.kubernetes.io/part-of: amp-credito
type: Opaque
stringData:
  POSTGRES_USER: amp
  POSTGRES_PASSWORD: amp
  CREDITO_SENHA: credito
  RISCO_SENHA: risco
  ANTIFRAUDE_SENHA: antifraude
  CONTRATACAO_SENHA: contratacao
