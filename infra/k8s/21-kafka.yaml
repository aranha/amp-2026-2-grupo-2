# Kafka em KRaft, um nó só (broker e controller), como no compose. StatefulSet com PVC: os
# offsets dos consumer groups e as mensagens sobrevivem quando o pod é recriado.
#
# Quando não vale: um broker não tem réplica de partição — perdeu o disco, perdeu os eventos.
# Em produção são três brokers com replication.factor=3 e min.insync.replicas=2 (ou um Kafka
# gerenciado); aqui o objetivo é o fluxo por evento rodar dentro do cluster.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: amp
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: amp-credito
spec:
  # Headless: "kafka" resolve direto para o pod, que é exatamente o endereço anunciado.
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: amp
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: amp-credito
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: amp-credito
    spec:
      # Obrigatório aqui: o Service "kafka" faria o Kubernetes injetar KAFKA_PORT=tcp://...,
      # e a imagem oficial transforma toda variável KAFKA_* em propriedade do broker.
      enableServiceLinks: false
      # appuser (uid 1000) da imagem oficial.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          ports:
            - name: kafka
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # 3 partições por tópico e criação automática, como no compose (ADR-006).
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/logs
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          # Porta aberta basta para os clientes: eles próprios refazem a conexão e o metadata.
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: dados
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: dados
        labels:
          app.kubernetes.io/name: kafka
          app.kubernetes.io/part-of: amp-credito
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
