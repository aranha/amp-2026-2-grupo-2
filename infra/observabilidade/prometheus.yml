global:
  scrape_interval: 15s

scrape_configs:
  # Métricas OTLP dos 5 serviços, já convertidas pelo Collector (job = service.name).
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']

  # Actuator dos serviços Java (Micrometer): estado dos circuit breakers do BFF e pool Hikari.
  - job_name: servicos-java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['bff:8080', 'servico-credito:8080', 'servico-risco:8080']
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: servico

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
