openapi: 3.0.3
info:
  title: Serviço de Contratação e Liberação
  version: 0.1.0
  description: Contrato preliminar; o fluxo de eventos ainda depende do aceite do AsyncAPI.
servers:
  - url: http://localhost:8085
paths:
  /health:
    get:
      operationId: health
      tags: [operacao]
      responses:
        "200":
          description: Serviço disponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
