# Stack completa do trabalho: broker, bancos, IdP e os três sinais de observabilidade.
#
#   docker compose up -d                 # só a infraestrutura
#   docker compose --profile apps up -d  # infraestrutura + os 5 serviços
#
# Portas: Kafka 19092 · Postgres 15432 · Kafka UI 8081 · Keycloak 8180
#         Grafana 3000 · Prometheus 9090 · Tempo 3200 · Loki 3100 · OTLP 4317/4318

name: amp-grupo-2

services:

  # ---------------------------------------------------------------- broker
  kafka:
    image: apache/kafka:3.9.1
    container_name: amp-kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: amp-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: grupo-2
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------- dados
  postgres:
    image: postgres:16-alpine
    container_name: amp-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: amp
      POSTGRES_USER: amp
      POSTGRES_PASSWORD: amp
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amp -d amp"]
      interval: 3s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- identidade
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: amp-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Emissor único: todo token sai com iss = http://localhost:8180/realms/credito, seja pedido
      # pelo navegador (localhost:8180) ou por um container (keycloak:8080). Com o backchannel
      # dinâmico, quem chama por keycloak:8080 recebe token/JWKS nesse mesmo endereço interno.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      # Realm exportado pelo Rafael. Enquanto não existir, o import é no-op.
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # SPA do Rafael. Fica junto do Keycloak porque é o client público dele (PKCE).
  # Porta 5173 no host: é o redirect URI cadastrado no realm. Não rode junto com `npm run dev`.
  app-cliente:
    build:
      context: ./app-cliente
    profiles: ["apps"]
    container_name: amp-app-cliente
    ports:
      - "5173:80"
    depends_on:
      keycloak:
        condition: service_healthy

  # ---------------------------------------------------------- observabilidade
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    container_name: amp-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # scrape do Prometheus
    volumes:
      - ./infra/observabilidade/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.6.1
    container_name: amp-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./infra/observabilidade/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.3.1
    container_name: amp-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: amp-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    container_name: amp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./infra/observabilidade/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/observabilidade/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/observabilidade/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

  # ---------------------------------------------------------------- serviços
  # Cada dono habilita o seu na Sprint 0, com o Dockerfile multi-stage da sua trilha.
  # Todos herdam OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 de x-otel.
  #
  #   bff                  → Paulo    (Java)    porta 8080
  #   servico-credito      → Vinicius (Java)    porta 8082
  #   servico-risco        → Guilherme (Java)   porta 8083
  #   servico-antifraude   → Hugo     (Python)  porta 8084
  #   servico-contratacao  → Marcus   (Python)  porta 8085
  #   app-cliente          → Rafael   (SPA)     porta 5173

  servico-antifraude:
    build:
      context: ./servico-antifraude
    profiles: ["apps"]
    container_name: amp-servico-antifraude
    ports:
      - "8084:8084"
    environment:
      BANCO_URL: postgresql://antifraude_user:antifraude@postgres:5432/amp
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      OTEL_SERVICE_NAME: servico-antifraude
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: /health
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  servico-contratacao:
    build:
      context: ./servico-contratacao
    profiles: ["apps"]
    container_name: amp-servico-contratacao
    ports:
      - "8085:8085"
    environment:
      CONTRACTING_DATABASE_URL: postgresql://contratacao_user:contratacao@postgres:5432/amp
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      CONTRACTING_ENABLE_KAFKA: "true"
      CONTRACTING_CORE_BANK_MODE: inprocess
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  bff:
    build:
      context: ./bff
    profiles: ["apps"]
    container_name: amp-bff
    ports:
      - "8080:8080"
    environment:
      OIDC_ISSUER: http://localhost:8180/realms/credito
      OIDC_JWKS: http://keycloak:8080/realms/credito/protocol/openid-connect/certs
      OIDC_AUDIENCE: bff-api
      CORS_ORIGENS: http://localhost:5173
      CREDITO_URL: http://servico-credito:8080
      RISCO_URL: http://servico-risco:8080
      ANTIFRAUDE_URL: http://servico-antifraude:8084
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres-data:
  grafana-data:
  prometheus-data:
  tempo-data:
  loki-data:
