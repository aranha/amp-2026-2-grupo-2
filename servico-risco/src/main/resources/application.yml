spring:
  application:
    name: servico-risco
  datasource:
    # Database per Service: o usuario risco_user so enxerga o schema risco (infra/postgres/init.sql).
    url: ${BANCO_URL:jdbc:postgresql://localhost:15432/amp}
    username: ${BANCO_USUARIO:risco_user}
    password: ${BANCO_SENHA:risco}
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: risco-credito-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
      # Texto puro: cada adaptador traduz a carga, e a DLQ guarda os bytes que chegaram.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 5000
    listener:
      ack-mode: manual_immediate

# 8083 rodando local, como no README; dentro do compose e do Kubernetes, 8080, como os demais
# servicos Java (o Dockerfile fixa SERVER_PORT).
server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  kafka:
    grupo:
      fluxo-credito: ${KAFKA_GRUPO_FLUXO_CREDITO:risco-fluxo-creditos-v1}
      saga-reserva: ${KAFKA_GRUPO_SAGA_RESERVA:risco-saga-reserva-v1}
      reprocessamento-dlq: ${KAFKA_GRUPO_REPROCESSAMENTO_DLQ:risco-reprocessamento-dlq-v1}
    # Desligado por padrao: reprocessar a DLQ e decisao do operador, depois de corrigir a
    # causa da falha. Ver a secao "Reprocessamento da DLQ" do README.
    reprocessamento-dlq:
      habilitado: ${REPROCESSAR_DLQ:false}
    topico:
      # credito.solicitacao.v1 e o topico do contrato (docs/contratos/asyncapi.yaml). O nome
      # herdado da AED continua assinado enquanto o servico-credito publicar nele; sai daqui
      # quando a migracao terminar.
      solicitacao: credito.solicitacao.v1,credito.solicitacao.solicitada.v1
      elegibilidade: risco.elegibilidade.v1
      limite-reservado: credito.limite.reservado.v1
      reserva-cancelada: credito.reserva-limite.cancelada.v1
      sufixo-dlq: ${KAFKA_SUFIXO_DLQ:.dlq}
    retentativa:
      # A retentativa e bloqueante na particao: tentativas x intervalo-maximo-ms precisa
      # ficar folgadamente abaixo de max.poll.interval.ms (5 min) para nao derrubar o
      # consumidor do grupo. Com os valores abaixo o pior caso e 7,5s.
      tentativas: ${RETENTATIVA_TENTATIVAS:4}
      intervalo-inicial-ms: ${RETENTATIVA_INTERVALO_INICIAL_MS:500}
      multiplicador: ${RETENTATIVA_MULTIPLICADOR:2.0}
      intervalo-maximo-ms: ${RETENTATIVA_INTERVALO_MAXIMO_MS:5000}
  fluxo-credito:
    maximo-janelas-retidas: ${FLUXO_CREDITO_MAXIMO_JANELAS_RETIDAS:288}
