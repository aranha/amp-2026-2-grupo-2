# Pipeline do trabalho. Dono: Guilherme (trilha/risco).
# Prova dois itens da ementa de uma vez: automação de teste em mais de uma linguagem
# e gerenciamento de dependências por plataforma (Maven e pip).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:

  teste-java:
    name: Teste · Java
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [bff, servico-credito, servico-risco]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Testes de domínio — sem framework, sem banco
        run: mvn -B -f ${{ matrix.servico }}/pom.xml test

  teste-python:
    name: Teste · Python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [servico-antifraude, servico-contratacao]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        shell: bash
        run: |
          if [[ -f "${{ matrix.servico }}/pyproject.toml" ]]; then
            python -m pip install -e "${{ matrix.servico }}[test]"
          elif [[ -f "${{ matrix.servico }}/requirements.txt" ]]; then
            python -m pip install -r "${{ matrix.servico }}/requirements.txt"
          else
            echo "::error::Nenhum pyproject.toml ou requirements.txt encontrado em ${{ matrix.servico }}"
            exit 1
          fi
      - name: Testes de domínio — sem framework, sem banco
        run: pytest ${{ matrix.servico }}/tests -v

  build:
    name: Build e push
    needs: [teste-java, teste-python]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servico: [bff, servico-credito, servico-risco, servico-antifraude, servico-contratacao]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-stage e push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servico }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.servico }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy em kind
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir cluster kind
        uses: helm/kind-action@v1
      - name: Aplicar manifests
        run: kubectl apply -f infra/k8s/
      - name: Esperar os Deployments
        run: kubectl rollout status -n amp deployment --timeout=180s
      # Plano B, se o kind não fechar a tempo:
      #   run: kubectl apply -f infra/k8s/ --dry-run=server
